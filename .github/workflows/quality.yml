name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build & axe audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 先查内容，再查类型，最后才构建——前两步失败时没必要等整站构建
      - name: Content lint (frontmatter, links, images, share cards)
        run: npm run lint:content

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Accessibility audit (axe, light + dark)
        run: |
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4321/blog/; then
              echo "preview ready"
              break
            fi
            sleep 1
          done
          npm run a11y
