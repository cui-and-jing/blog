name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 连续推送时只保留最新一次：旧提交的检查结果已经没人看，
# 十几条流水线并跑还会互相抢 runner（曾出现过瞬时失败的重跑）。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build, budget & a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 先查内容，再查类型，最后才构建——前两步失败时没必要等整站构建
      - name: Content lint (frontmatter, links, images, typography, share cards)
        run: npm run lint:content

      # 子集缺字不会报错，只会在线上悄悄回退成系统字体，必须显式比对
      - name: Font subset coverage
        run: npm run fonts:check

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # 体积一旦涨上去就很难降回来，放在构建之后、浏览器测试之前
      - name: Size budget (CSS / JS / HTML / images)
        run: npm run budget

      # 字体按页分片：哪一页用到子集外的字，线上会悄悄回退成系统宋体
      - name: Per-page font coverage
        run: npm run fonts:check:pages

      # 三条检查拆成三个 step：合成一条时只知道「整块失败」，
      # 分开放才能从红色叉号直接看出是 axe、键盘实测还是传输预算挂了
      - name: Start preview server
        run: |
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4321/blog/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4321/blog/ && echo "preview ready"

      - name: Accessibility audit (axe, light + dark)
        run: npm run a11y

      # 这一步红的时候，日志只有一行 exit code 1（读日志要管理员权限）。
      # 把每条路由的违规明细传上来，失败时直接下载就能定位是哪一页、哪条规则。
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: .shots/a11y.json
          if-no-files-found: warn
          retention-days: 7

      - name: Keyboard & screen reader checks
        run: npm run a11y:keys

      # 实测第一次访问要下多少字节，防止「文件没变大但每页多请求了字体」
      - name: First-visit transfer budget
        run: npm run budget:wire
