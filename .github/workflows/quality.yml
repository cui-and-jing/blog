name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 连续推送时只保留最新一次：旧提交的检查结果已经没人看，
# 十几条流水线并跑还会互相抢 runner（曾出现过瞬时失败的重跑）。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build, budget & a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 先查内容，再查类型，最后才构建——前两步失败时没必要等整站构建
      - name: Content lint (frontmatter, links, images, typography, share cards)
        run: npm run lint:content

      # 子集缺字不会报错，只会在线上悄悄回退成系统字体，必须显式比对
      - name: Font subset coverage
        run: npm run fonts:check

      # Check that Pages only publishes the current main SHA after Quality succeeds.
      - name: Deployment release gate contract
        run: npm run deploy:check

      - name: Type check
        run: npm run check

      # Use a virtual clock to verify that the weapon timer, boss attack phases
      # and stage transitions actually work, without a fragile 30s robot run.
      - name: Pixel Raid combat contracts
        run: npm run raid:test

      - name: Build
        run: npm run build

      # 构建后的真实导航和静态资源也要可达；Markdown lint 无法覆盖组件生成的链接
      - name: Emitted routes, assets and anchor links
        run: npm run links:check

      # 体积一旦涨上去就很难降回来，放在构建之后、浏览器测试之前
      - name: Sitemap metadata and indexability contract
        run: npm run sitemap:check

      - name: RSS full text contract
        run: npm run rss:check

      - name: Size budget (CSS / JS / HTML / images / games)
        run: npm run budget

      # 字体按页分片：哪一页用到子集外的字，线上会悄悄回退成系统宋体
      - name: Per-page font coverage
        run: npm run fonts:check:pages

      # 四项检查拆成四个 step：合成一条时只知道「整块失败」，
      # 分开放才能从红色叉号直接看出是游戏冒烟、axe、键盘实测还是传输预算挂了
      - name: Start preview server
        run: |
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4321/blog/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4321/blog/ && echo "preview ready"

      # 同 a11y：日志要管理员权限，红的时候什么都看不到，所以写进公开可读的 step summary
      - name: Game smoke test
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm run games:smoke 2>&1 | tee /tmp/games-smoke.log || status=$?
          {
            echo '## 游戏冒烟结果'
            echo '```'
            tail -n 40 /tmp/games-smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            # 失败可能发生在打印表格之前（比如浏览器起不来），所以整段都吐成注解，
            # 别只挑关键字——挑不到的时候就什么都没留下
            tail -n 30 /tmp/games-smoke.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      - name: Accessibility audit (axe, light + dark)
        shell: bash
        run: |
          # 日志要管理员权限才能看，红的时候等于什么都没留下。
          # 所以：① tee 一份进 artifact；② 末尾几十行写进 step summary（那个页面公开可读）
          set -o pipefail
          mkdir -p .shots
          status=0
          npm run a11y 2>&1 | tee .shots/a11y.log || status=$?
          {
            echo '## 无障碍扫描结果'
            echo '```'
            tail -n 60 .shots/a11y.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            # 只认 ✗ 会一条都抓不到：a11y 的行首标记是 ERR / FAIL（Quality #47 就只抓到了汇总行）。
            # 抓不到关键行时退回整段末尾——宁可多吐几行，也别留下一个没有线索的红灯。
            hits=$(grep -E '^(ERR|FAIL)|^ {6}·|无法完成扫描' .shots/a11y.log | head -10 || true)
            if [ -z "$hits" ]; then hits=$(tail -n 15 .shots/a11y.log); fi
            printf '%s\n' "$hits" | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            .shots/a11y.json
            .shots/a11y.log
          if-no-files-found: warn
          retention-days: 7

      # 失败时把关键行做成注解：注解在运行页上公开可见，step summary 与日志都要另找入口
      - name: Keyboard & screen reader checks
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm run a11y:keys 2>&1 | tee /tmp/keys.log || status=$?
          if [ $status -ne 0 ]; then
            hits=$(grep -E '✗|失败|异常' /tmp/keys.log | head -6 || true)
            if [ -z "$hits" ]; then hits=$(tail -n 15 /tmp/keys.log); fi
            printf '%s\n' "$hits" | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      # 实测第一次访问要下多少字节，防止「文件没变大但每页多请求了字体」
      - name: First-visit transfer budget
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm run budget:wire 2>&1 | tee /tmp/wire.log || status=$?
          if [ $status -ne 0 ]; then
            hits=$(grep -E '✗|超预算|打不开' /tmp/wire.log | head -8 || true)
            if [ -z "$hits" ]; then hits=$(tail -n 15 /tmp/wire.log); fi
            printf '%s\n' "$hits" | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status
