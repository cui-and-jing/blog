name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build, budget & a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 先查内容，再查类型，最后才构建——前两步失败时没必要等整站构建
      - name: Content lint (frontmatter, links, images, typography, share cards)
        run: npm run lint:content

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # 体积一旦涨上去就很难降回来，放在构建之后、浏览器测试之前
      - name: Size budget (CSS / JS / HTML / images)
        run: npm run budget

      - name: Accessibility & keyboard audit (axe + real interactions)
        run: |
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4321/blog/; then
              echo "preview ready"
              break
            fi
            sleep 1
          done
          npm run a11y
          npm run a11y:keys
