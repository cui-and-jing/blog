<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BREAKOUT · 打砖块</title>
    <meta name="description" content="一块板、一颗球、五排砖。板子接球的位置决定反弹角度，三条命，清完一屏换下一关。" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f2f0e9;
        --card: #fffdf8;
        --ink: #1b1916;
        --soft: #55504a;
        --mute: #696359;
        --line: #e2dcd0;
        --accent: #b4431f;
        color-scheme: light;
      }

      html[data-theme='dark'] {
        --bg: #131311;
        --card: #1c1c19;
        --ink: #ede9e0;
        --soft: #a9a49a;
        --mute: #989186;
        --line: #2b2a26;
        --accent: #e2825c;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        overflow: hidden;
      }

      .bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px 6px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        min-width: 58px;
        padding: 5px 12px 6px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
      }

      .stat b {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        font-size: 10.5px;
        letter-spacing: 0.04em;
        color: var(--mute);
      }

      .spacer {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--soft);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: color 0.18s ease, border-color 0.18s ease;
      }

      .btn:hover {
        color: var(--ink);
        border-color: color-mix(in srgb, var(--ink) 24%, transparent);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 4px 12px 12px;
      }

      canvas {
        display: block;
        touch-action: none;
        border-radius: 14px;
      }

      .over {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        justify-items: center;
        gap: 12px;
        min-width: 220px;
        padding: 22px 26px;
        text-align: center;
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.4);
      }

      .over[hidden] {
        display: none;
      }

      .over p {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 19px;
        line-height: 1.4;
      }

      .over small {
        color: var(--mute);
        font-size: 12.5px;
        line-height: 1.6;
      }

      .primary {
        min-height: 42px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 13.5px;
        cursor: pointer;
      }

      html[data-theme='dark'] .primary {
        color: #10100e;
      }

      .primary:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .hint {
        margin: 0;
        min-height: 17px;
        font-size: 12.5px;
        color: var(--mute);
        text-align: center;
      }

      /* 独立打开这一页时也要有个 h1，屏幕阅读器才知道这是什么地方 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <header class="bar">
      <div class="stat"><b id="score">0</b><span>分数</span></div>
      <div class="stat"><b id="lives">3</b><span>命</span></div>
      <div class="stat"><b id="level">1</b><span>关</span></div>
      <span class="spacer"></span>
      <button class="btn" id="pauseBtn" type="button">暂停</button>
      <button class="btn" id="restart" type="button">重开</button>
    </header>

    <main class="stage" id="stage">
      <h1 class="sr-only">打砖块</h1>
      <canvas id="board" width="480" height="600" role="img" aria-label="打砖块场地"></canvas>
      <div class="over" id="over">
        <p id="over-title">按空格发球</p>
        <small id="over-sub">左右移动板子，接住球</small>
        <button class="primary" id="over-btn" type="button">开始</button>
      </div>
      <p class="hint" id="hint" aria-live="polite">方向键 / A D 移动，鼠标或手指也能拖</p>
    </main>

    <script>
      (() => {
        'use strict';

        const LEVEL_KEY = 'cj:breakout:level';
        const LIVES = 3;

        const canvas = document.getElementById('board');
        const stage = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartEl = document.getElementById('restart');
        const hintEl = document.getElementById('hint');
        const overEl = document.getElementById('over');
        const overTitle = document.getElementById('over-title');
        const overSub = document.getElementById('over-sub');
        const overBtn = document.getElementById('over-btn');

        const PALETTE = {
          light: {
            field: '#fbf9f3',
            edge: '#e6e0d3',
            ball: '#1b1916',
            paddle: '#b4431f',
            rows: ['#8f3a18', '#a8491d', '#c05a24', '#c9752f', '#d9924a'],
            smash: '#e8d6b4',
          },
          dark: {
            field: '#191917',
            edge: '#2b2a26',
            ball: '#f4f0e6',
            paddle: '#e2825c',
            rows: ['#e2825c', '#cf7048', '#bb6038', '#a5522c', '#8f4525'],
            smash: '#4a3a2a',
          },
        };

        const state = {
          mode: 'ready', // ready | serve | running | paused | over
          score: 0,
          lives: LIVES,
          level: 1,
          w: 480,
          h: 600,
          paddle: { x: 200, y: 560, w: 92, h: 12 },
          ball: { x: 240, y: 540, vx: 0, vy: 0, r: 8 },
          bricks: [],
          keys: { left: false, right: false },
          speed: 380,
        };

        function palette() {
          return PALETTE[document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'];
        }

        /* ---------- 布局 ---------- */
        function resize() {
          const rect = stage.getBoundingClientRect();
          const availW = Math.max(240, rect.width - 24);
          const availH = Math.max(320, rect.height - 46);
          /* 竖屏按宽度定，横屏按高度定，别让球在超宽画布上跑太慢 */
          const w = Math.min(availW, Math.max(300, availH * 0.72));
          const h = Math.min(availH, w / 0.62);
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.style.width = Math.round(w) + 'px';
          canvas.style.height = Math.round(h) + 'px';
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          state.w = w;
          state.h = h;
          state.paddle.w = Math.max(66, Math.min(w * 0.22, 120));
          state.paddle.h = Math.max(10, h * 0.018);
          state.paddle.y = h - state.paddle.h - h * 0.06;
          state.ball.r = Math.max(6, Math.min(w, h) * 0.016);
          state.paddle.x = Math.max(4, Math.min(state.paddle.x, w - state.paddle.w - 4));
          /* 尺寸变了砖块必须重排，否则会跑到画布外面去。分数和关卡保留，
             球回到板子上重新发——比留一屏错位的砖块更不容易让人困惑 */
          buildBricks();
          if (state.mode !== 'paused' && state.mode !== 'over') stickBall();
          draw();
        }

        function buildBricks() {
          const cols = Math.max(6, Math.min(12, Math.round(state.w / 74)));
          const gap = Math.max(4, state.w * 0.012);
          const pad = gap * 2;
          const bw = (state.w - pad * 2 - gap * (cols - 1)) / cols;
          const bh = Math.max(14, Math.min(26, state.h * 0.035));
          const top = Math.max(34, state.h * 0.08);
          /* 行数跟着画布高度走：竖屏矮的时候不至于只占顶上一条，
             高屏也不会空出半个场子 */
          const rows = Math.max(5, Math.min(8, Math.round((state.h * 0.32) / (bh + gap))));
          state.bricks = [];
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              state.bricks.push({
                x: pad + c * (bw + gap),
                y: top + r * (bh + gap),
                w: bw,
                h: bh,
                row: r,
                hp: r === 0 ? 2 : 1,
                alive: true,
              });
            }
          }
        }

        function stickBall() {
          state.ball.x = state.paddle.x + state.paddle.w / 2;
          state.ball.y = state.paddle.y - state.ball.r - 1;
          state.ball.vx = 0;
          state.ball.vy = 0;
          state.mode = 'serve';
          hintEl.textContent = '按空格 / 点一下发球';
        }

        /* ---------- 绘制 ---------- */
        function roundRect(x, y, w, h, r) {
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        function draw() {
          const p = palette();
          const { w, h } = state;

          ctx.clearRect(0, 0, w, h);
          roundRect(0.5, 0.5, w - 1, h - 1, 14);
          ctx.fillStyle = p.field;
          ctx.fill();
          ctx.strokeStyle = p.edge;
          ctx.lineWidth = 1;
          ctx.stroke();

          for (const b of state.bricks) {
            if (!b.alive) continue;
            ctx.fillStyle = p.rows[b.row];
            roundRect(b.x, b.y, b.w, b.h, Math.min(6, b.h / 2.6));
            ctx.fill();
            if (b.hp > 1) {
              ctx.fillStyle = p.smash;
              ctx.globalAlpha = 0.55;
              roundRect(b.x + b.w * 0.16, b.y + b.h * 0.34, b.w * 0.68, Math.max(2, b.h * 0.16), 2);
              ctx.fill();
              ctx.globalAlpha = 1;
            }
          }

          ctx.fillStyle = p.paddle;
          roundRect(state.paddle.x, state.paddle.y, state.paddle.w, state.paddle.h, state.paddle.h / 2);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI * 2);
          ctx.fillStyle = p.ball;
          ctx.fill();
        }

        /* ---------- 规则 ---------- */
        function resetBall(full) {
          if (full) {
            state.score = 0;
            state.lives = LIVES;
            state.level = 1;
            state.speed = 380;
            buildBricks();
          }
          scoreEl.textContent = state.score;
          livesEl.textContent = state.lives;
          levelEl.textContent = state.level;
          stickBall();
          draw();
        }

        function reset() {
          state.mode = 'ready';
          state.paddle.x = state.w / 2 - state.paddle.w / 2;
          resetBall(true);
          showOver('ready');
        }

        function launch() {
          if (state.mode === 'serve') {
            const speed = state.speed;
            const angle = (-60 + Math.random() * 40) * (Math.PI / 180);
            state.ball.vx = Math.sin(angle) * speed;
            state.ball.vy = -Math.cos(angle) * speed;
            state.mode = 'running';
            hideOver();
            hintEl.textContent = '板子接球的位置越靠边，反弹角度越斜';
          } else if (state.mode === 'ready') {
            state.mode = 'serve';
            hideOver();
            launch();
          }
        }

        function togglePause() {
          if (state.mode === 'running' || state.mode === 'serve') {
            state.pausedFrom = state.mode;
            state.mode = 'paused';
            pauseBtn.textContent = '继续';
            showOver('paused');
            hintEl.textContent = '已暂停';
          } else if (state.mode === 'paused') {
            state.mode = state.pausedFrom || 'running';
            pauseBtn.textContent = '暂停';
            hideOver();
          }
        }

        function showOver(kind) {
          overEl.hidden = false;
          if (kind === 'ready') {
            overTitle.textContent = '按空格发球';
            overSub.textContent = '左右移动板子，接住球';
            overBtn.textContent = '开始';
          } else if (kind === 'paused') {
            overTitle.textContent = '已暂停';
            overSub.textContent = `${state.score} 分 · 第 ${state.level} 关`;
            overBtn.textContent = '继续';
          } else {
            overTitle.textContent = '三条命用完了';
            overSub.textContent = `${state.score} 分 · 打到第 ${state.level} 关`;
            overBtn.textContent = '再来一局';
          }
          overBtn.focus({ preventScroll: true });
        }

        function hideOver() {
          overEl.hidden = true;
        }

        function nextLevel() {
          state.level += 1;
          state.speed *= 1.08;
          levelEl.textContent = state.level;
          buildBricks();
          stickBall();
          draw();
          hintEl.textContent = `第 ${state.level} 关`;
          state.mode = 'serve';
          hideOver();
        }

        function loseLife() {
          state.lives -= 1;
          livesEl.textContent = state.lives;
          if (state.lives <= 0) {
            state.mode = 'over';
            pauseBtn.textContent = '暂停';
            hintEl.textContent = '三条命用完了，按空格再来';
            showOver('over');
            return;
          }
          stickBall();
          hideOver();
        }

        /* ---------- 物理 ---------- */
        function hitBrick(ball, brick) {
          const nearestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
          const nearestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
          const dx = ball.x - nearestX;
          const dy = ball.y - nearestY;
          if (dx * dx + dy * dy > ball.r * ball.r) return false;

          /* 用「球心到砖块中心」的归一化偏移判断从哪一面撞进去，
             比单纯比较穿透深度稳：球速快时也不会穿到砖里再弹 */
          const cx = brick.x + brick.w / 2;
          const cy = brick.y + brick.h / 2;
          const ox = (ball.x - cx) / (brick.w / 2 + ball.r);
          const oy = (ball.y - cy) / (brick.h / 2 + ball.r);
          if (Math.abs(ox) > Math.abs(oy)) {
            ball.vx = Math.abs(ball.vx) * (ox > 0 ? 1 : -1);
            ball.x = ox > 0 ? brick.x + brick.w + ball.r : brick.x - ball.r;
          } else {
            ball.vy = Math.abs(ball.vy) * (oy > 0 ? 1 : -1);
            ball.y = oy > 0 ? brick.y + brick.h + ball.r : brick.y - ball.r;
          }
          return true;
        }

        function update(dt) {
          const { paddle, ball, w, h } = state;

          const speed = 460;
          if (state.keys.left) paddle.x -= speed * dt;
          if (state.keys.right) paddle.x += speed * dt;
          paddle.x = Math.max(4, Math.min(w - paddle.w - 4, paddle.x));

          if (state.mode === 'serve') {
            ball.x = paddle.x + paddle.w / 2;
            ball.y = paddle.y - ball.r - 1;
            return;
          }
          if (state.mode !== 'running') return;

          /* 分步推进：一帧走得远时拆成几小步，避免高速穿砖 */
          const steps = Math.max(1, Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / (ball.r * 0.8)));
          const sub = dt / steps;

          for (let s = 0; s < steps; s++) {
            ball.x += ball.vx * sub;
            ball.y += ball.vy * sub;

            if (ball.x - ball.r < 2) {
              ball.x = 2 + ball.r;
              ball.vx = Math.abs(ball.vx);
            } else if (ball.x + ball.r > w - 2) {
              ball.x = w - 2 - ball.r;
              ball.vx = -Math.abs(ball.vx);
            }
            if (ball.y - ball.r < 2) {
              ball.y = 2 + ball.r;
              ball.vy = Math.abs(ball.vy);
            }

            /* 板子：按落点偏移改角度，手感全靠这一下 */
            if (
              ball.vy > 0 &&
              ball.y + ball.r >= paddle.y &&
              ball.y - ball.r <= paddle.y + paddle.h &&
              ball.x >= paddle.x - ball.r * 0.6 &&
              ball.x <= paddle.x + paddle.w + ball.r * 0.6
            ) {
              const t = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
              const angle = Math.max(-1.15, Math.min(1.15, t * 1.15));
              const sp = Math.hypot(ball.vx, ball.vy) || state.speed;
              ball.vx = Math.sin(angle) * sp;
              ball.vy = -Math.abs(Math.cos(angle) * sp);
              ball.y = paddle.y - ball.r - 0.5;
            }

            for (const b of state.bricks) {
              if (!b.alive) continue;
              if (!hitBrick(ball, b)) continue;
              b.hp -= 1;
              if (b.hp <= 0) {
                b.alive = false;
                state.score += 20;
              } else {
                state.score += 10;
              }
              scoreEl.textContent = state.score;
              break;
            }

            if (ball.y - ball.r > h) {
              loseLife();
              return;
            }
          }

          if (!state.bricks.some((b) => b.alive)) nextLevel();
        }

        let last = 0;
        function loop(now) {
          requestAnimationFrame(loop);
          const dt = Math.min((now - last) / 1000 || 0, 0.05);
          last = now;
          if (state.mode === 'running' || state.mode === 'serve') update(dt);
          draw();
        }

        /* ---------- 输入 ---------- */
        function pointerMove(clientX) {
          const rect = canvas.getBoundingClientRect();
          const x = ((clientX - rect.left) / rect.width) * state.w;
          state.paddle.x = Math.max(4, Math.min(state.w - state.paddle.w - 4, x - state.paddle.w / 2));
        }

        canvas.addEventListener('pointermove', (e) => {
          if (e.pointerType === 'mouse' && e.buttons === 0) pointerMove(e.clientX);
          else if (e.pointerType !== 'mouse') pointerMove(e.clientX);
        });
        canvas.addEventListener('pointerdown', (e) => {
          pointerMove(e.clientX);
          if (state.mode === 'ready') {
            state.mode = 'serve';
            hideOver();
          }
          if (state.mode === 'serve') launch();
        });

        window.addEventListener('keydown', (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            e.preventDefault();
            state.keys.left = true;
          } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            e.preventDefault();
            state.keys.right = true;
          } else if (e.key === ' ') {
            e.preventDefault();
            if (state.mode === 'over') reset();
            else if (state.mode === 'ready') {
              state.mode = 'serve';
              hideOver();
              launch();
            } else launch();
          } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
            e.preventDefault();
            togglePause();
          } else if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            reset();
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.keys.left = false;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.keys.right = false;
        });

        overBtn.addEventListener('click', () => {
          if (state.mode === 'paused') togglePause();
          else if (state.mode === 'over') reset();
          else {
            state.mode = 'serve';
            hideOver();
            launch();
          }
        });
        pauseBtn.addEventListener('click', () => {
          if (state.mode === 'ready' || state.mode === 'over') {
            reset();
            state.mode = 'serve';
            hideOver();
            launch();
          } else {
            togglePause();
          }
        });
        restartEl.addEventListener('click', reset);

        document.addEventListener('visibilitychange', () => {
          if (document.hidden && (state.mode === 'running' || state.mode === 'serve')) togglePause();
        });

        function applyTheme() {
          let t = null;
          try {
            t = window.parent.document.documentElement.dataset.theme;
          } catch {
            /* 忽略 */
          }
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          /* 只在真的变了才写：单独打开时观察的是自己，写回会再触发一次观察回调 */
          const next = t === 'dark' ? 'dark' : 'light';
          if (document.documentElement.dataset.theme !== next) {
            document.documentElement.dataset.theme = next;
          }
          draw();
        }

        applyTheme();
        /* 单独打开时 window.parent 就是自己，观察自己会和上面的写回打成一团 */
        if (window.parent !== window) {
          try {
            new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ['data-theme'],
            });
          } catch {
            /* 跨域时没有可观察的父页面 */
          }
        }
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
        window.addEventListener('resize', resize);
        if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

        resize();
        reset();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
