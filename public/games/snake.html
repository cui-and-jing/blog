<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SNAKE · 贪吃蛇</title>
    <meta name="description" content="一条越吃越长的线，越吃越快。方向键或滑动操作，最高分存在本地。" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f2f0e9;
        --card: #fffdf8;
        --ink: #1b1916;
        --soft: #55504a;
        --mute: #696359;
        --line: #e2dcd0;
        --accent: #2f6f66;
        color-scheme: light;
      }

      html[data-theme='dark'] {
        --bg: #131311;
        --card: #1c1c19;
        --ink: #ede9e0;
        --soft: #a9a49a;
        --mute: #989186;
        --line: #2b2a26;
        --accent: #74b8ab;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        overflow: hidden;
      }

      .bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px 6px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        min-width: 62px;
        padding: 5px 12px 6px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
      }

      .stat b {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        font-size: 10.5px;
        letter-spacing: 0.04em;
        color: var(--mute);
      }

      .spacer {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--soft);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: color 0.18s ease, border-color 0.18s ease;
      }

      .btn:hover {
        color: var(--ink);
        border-color: color-mix(in srgb, var(--ink) 24%, transparent);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 4px 12px 12px;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      .over {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        justify-items: center;
        gap: 12px;
        min-width: 210px;
        padding: 22px 26px;
        text-align: center;
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.4);
      }

      .over[hidden] {
        display: none;
      }

      .over p {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 19px;
        line-height: 1.4;
      }

      .over small {
        color: var(--mute);
        font-size: 12.5px;
      }

      .primary {
        min-height: 42px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 13.5px;
        cursor: pointer;
      }

      html[data-theme='dark'] .primary {
        color: #10100e;
      }

      .primary:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .hint {
        margin: 0;
        min-height: 17px;
        font-size: 12.5px;
        color: var(--mute);
        text-align: center;
      }

      /* 独立打开这一页时也要有个 h1，屏幕阅读器才知道这是什么地方 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <header class="bar">
      <div class="stat"><b id="score">0</b><span>分数</span></div>
      <div class="stat"><b id="best">0</b><span>最高</span></div>
      <span class="spacer"></span>
      <button class="btn" id="pauseBtn" type="button">暂停</button>
      <button class="btn" id="restart" type="button">重开</button>
    </header>

    <main class="stage" id="stage">
      <h1 class="sr-only">贪吃蛇</h1>
      <canvas id="board" width="420" height="420" role="img" aria-label="贪吃蛇棋盘"></canvas>
      <div class="over" id="over">
        <p id="over-title">按空格开始</p>
        <small id="over-sub">方向键 / WASD 转向，也能直接滑动</small>
        <button class="primary" id="over-btn" type="button">开始</button>
      </div>
      <p class="hint" id="hint" aria-live="polite">吃到一颗长一节，速度会跟着变快</p>
    </main>

    <script>
      (() => {
        'use strict';

        const COLS = 21;
        const ROWS = 21;
        const BEST_KEY = 'cj:snake:best';
        const START_MS = 148;
        const MIN_MS = 72;

        const canvas = document.getElementById('board');
        const stage = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartEl = document.getElementById('restart');
        const hintEl = document.getElementById('hint');
        const overEl = document.getElementById('over');
        const overTitle = document.getElementById('over-title');
        const overSub = document.getElementById('over-sub');
        const overBtn = document.getElementById('over-btn');

        const PALETTE = {
          light: { board: '#fbf9f3', border: '#e6e0d3', grid: '#efeadf', head: '#2f6f66', tail: '#8cc0ac', food: '#c2532a', eye: '#f7fffb' },
          dark: { board: '#191917', border: '#2b2a26', grid: '#22221f', head: '#74b8ab', tail: '#3d8074', food: '#e2825c', eye: '#16241f' },
        };

        let snake = [];
        let dir = { x: 1, y: 0 };
        let queue = [];
        let food = { x: 0, y: 0 };
        let score = 0;
        let best = readBest();
        let state = 'ready'; // ready | running | paused | over
        let stepMs = START_MS;
        let acc = 0;
        let last = 0;
        let cell = 18;
        let originX = 0;
        let originY = 0;

        function readBest() {
          try {
            return Number(localStorage.getItem(BEST_KEY)) || 0;
          } catch {
            return 0;
          }
        }

        function writeBest(v) {
          try {
            localStorage.setItem(BEST_KEY, String(v));
          } catch {
            /* 忽略 */
          }
        }

        function palette() {
          return PALETTE[document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'];
        }

        /* ---------- 尺寸 ---------- */
        function resize() {
          const rect = stage.getBoundingClientRect();
          /* 减去内边距与底部提示行的高度，否则画布会把提示挤出可视区 */
          const avail = Math.min(rect.width - 24, rect.height - 46);
          const size = Math.max(240, Math.floor(avail));
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.style.width = size + 'px';
          canvas.style.height = size + 'px';
          canvas.width = Math.round(size * dpr);
          canvas.height = Math.round(size * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          cell = size / COLS;
          originX = 0;
          originY = 0;
          draw();
        }

        function cx(x) {
          return originX + x * cell + cell / 2;
        }

        function cy(y) {
          return originY + y * cell + cell / 2;
        }

        /* ---------- 像素绘制 ---------- */
        function roundRect(x, y, w, h, r) {
          const radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.arcTo(x + w, y, x + w, y + h, radius);
          ctx.arcTo(x + w, y + h, x, y + h, radius);
          ctx.arcTo(x, y + h, x, y, radius);
          ctx.arcTo(x, y, x + w, y, radius);
          ctx.closePath();
        }

        function draw() {
          const p = palette();
          const w = COLS * cell;
          const h = ROWS * cell;

          ctx.clearRect(0, 0, w, h);
          roundRect(0.5, 0.5, w - 1, h - 1, Math.max(8, cell * 0.9));
          ctx.fillStyle = p.board;
          ctx.fill();
          ctx.strokeStyle = p.border;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.save();
          roundRect(1, 1, w - 2, h - 2, Math.max(8, cell * 0.9));
          ctx.clip();

          ctx.strokeStyle = p.grid;
          ctx.lineWidth = 1;
          for (let i = 1; i < COLS; i++) {
            ctx.beginPath();
            ctx.moveTo(Math.round(i * cell) + 0.5, 0);
            ctx.lineTo(Math.round(i * cell) + 0.5, h);
            ctx.stroke();
          }
          for (let j = 1; j < ROWS; j++) {
            ctx.beginPath();
            ctx.moveTo(0, Math.round(j * cell) + 0.5);
            ctx.lineTo(w, Math.round(j * cell) + 0.5);
            ctx.stroke();
          }

          /* 食物：外圈淡、内圈实，深色底上也能一眼找到 */
          const fr = cell * 0.3;
          ctx.beginPath();
          ctx.arc(cx(food.x), cy(food.y), cell * 0.42, 0, Math.PI * 2);
          ctx.fillStyle = p.food + '22';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx(food.x), cy(food.y), fr, 0, Math.PI * 2);
          ctx.fillStyle = p.food;
          ctx.fill();

          const n = snake.length;
          for (let i = n - 1; i >= 0; i--) {
            const seg = snake[i];
            const t = n === 1 ? 0 : i / (n - 1);
            ctx.fillStyle = i === 0 ? p.head : mix(p.head, p.tail, t);
            const pad = cell * (i === 0 ? 0.1 : 0.14);
            roundRect(
              originX + seg.x * cell + pad,
              originY + seg.y * cell + pad,
              cell - pad * 2,
              cell - pad * 2,
              cell * (i === 0 ? 0.34 : 0.26)
            );
            ctx.fill();
          }

          /* 眼睛朝向当前方向，一眼能看出头在哪 */
          const head = snake[0];
          if (head) {
            const hx = cx(head.x);
            const hy = cy(head.y);
            const off = cell * 0.17;
            const r = Math.max(1.4, cell * 0.085);
            const dx = dir.x * off;
            const dy = dir.y * off;
            const px = dir.x === 0 ? off : 0;
            const py = dir.y === 0 ? off : 0;
            ctx.fillStyle = p.eye;
            ctx.beginPath();
            ctx.arc(hx + dx + px, hy + dy + py, r, 0, Math.PI * 2);
            ctx.arc(hx + dx - px, hy + dy - py, r, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        function mix(a, b, t) {
          const pa = hex(a);
          const pb = hex(b);
          const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
          return `rgb(${c[0]},${c[1]},${c[2]})`;
        }

        function hex(s) {
          const v = s.replace('#', '');
          return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
        }

        /* ---------- 规则 ---------- */
        function placeFood() {
          const free = [];
          for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
              if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
            }
          }
          if (!free.length) return;
          food = free[Math.floor(Math.random() * free.length)];
        }

        function reset() {
          snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 },
          ];
          dir = { x: 1, y: 0 };
          queue = [];
          score = 0;
          stepMs = START_MS;
          acc = 0;
          state = 'ready';
          scoreEl.textContent = '0';
          bestEl.textContent = best;
          placeFood();
          showOver('ready');
          draw();
        }

        function start() {
          if (state === 'over') reset();
          state = 'running';
          last = performance.now();
          acc = 0;
          hideOver();
          pauseBtn.textContent = '暂停';
          hintEl.textContent = '吃到一颗长一节，速度会跟着变快';
        }

        function togglePause() {
          if (state === 'running') {
            state = 'paused';
            showOver('paused');
            pauseBtn.textContent = '继续';
            hintEl.textContent = '已暂停';
          } else if (state === 'paused') {
            start();
          }
        }

        function showOver(kind) {
          overEl.hidden = false;
          if (kind === 'ready') {
            overTitle.textContent = '按空格开始';
            overSub.textContent = '方向键 / WASD 转向，也能直接滑动';
            overBtn.textContent = '开始';
          } else if (kind === 'paused') {
            overTitle.textContent = '已暂停';
            overSub.textContent = `当前 ${score} 分`;
            overBtn.textContent = '继续';
          } else {
            overTitle.textContent = '撞到了';
            overSub.textContent = `这局 ${score} 分 · 最高 ${best} 分`;
            overBtn.textContent = '再来一局';
          }
          overBtn.focus({ preventScroll: true });
        }

        function hideOver() {
          overEl.hidden = true;
        }

        function step() {
          if (queue.length) {
            const next = queue.shift();
            if (next.x !== -dir.x || next.y !== -dir.y) dir = next;
          }

          const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

          if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
            gameOver();
            return;
          }
          if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) {
            gameOver();
            return;
          }

          snake.unshift(head);

          if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            if (score > best) {
              best = score;
              writeBest(best);
              bestEl.textContent = best;
            }
            stepMs = Math.max(MIN_MS, stepMs - 4);
            placeFood();
          } else {
            snake.pop();
          }

          draw();
        }

        function gameOver() {
          state = 'over';
          pauseBtn.textContent = '暂停';
          hintEl.textContent = '这一局结束了，按空格再来';
          showOver('over');
          draw();
        }

        function loop(now) {
          requestAnimationFrame(loop);
          if (state !== 'running') return;
          const dt = Math.min(now - last, 250);
          last = now;
          acc += dt;
          while (acc >= stepMs) {
            acc -= stepMs;
            if (state !== 'running') break;
            step();
          }
        }

        /* ---------- 输入 ---------- */
        const DIRS = {
          ArrowLeft: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 },
          ArrowUp: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 },
          a: { x: -1, y: 0 },
          d: { x: 1, y: 0 },
          w: { x: 0, y: -1 },
          s: { x: 0, y: 1 },
          A: { x: -1, y: 0 },
          D: { x: 1, y: 0 },
          W: { x: 0, y: -1 },
          S: { x: 0, y: 1 },
        };

        function push(next) {
          const lastDir = queue.length ? queue[queue.length - 1] : dir;
          if (next.x === lastDir.x && next.y === lastDir.y) return;
          if (next.x === -lastDir.x && next.y === -lastDir.y) return;
          if (queue.length < 2) queue.push(next);
        }

        window.addEventListener('keydown', (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.key === ' ') {
            e.preventDefault();
            if (state === 'running' || state === 'paused') togglePause();
            else start();
            return;
          }
          if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            reset();
            return;
          }
          const next = DIRS[e.key];
          if (!next) return;
          e.preventDefault();
          if (state === 'ready') start();
          if (state === 'running') push(next);
        });

        let touch = null;
        canvas.addEventListener('pointerdown', (e) => {
          touch = { x: e.clientX, y: e.clientY };
        });
        canvas.addEventListener('pointerup', (e) => {
          if (!touch) return;
          const dx = e.clientX - touch.x;
          const dy = e.clientY - touch.y;
          touch = null;
          if (Math.hypot(dx, dy) < 18) return;
          if (state === 'ready') start();
          if (state !== 'running') return;
          push(Math.abs(dx) > Math.abs(dy) ? { x: dx > 0 ? 1 : -1, y: 0 } : { x: 0, y: dy > 0 ? 1 : -1 });
        });

        overBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', () => {
          if (state === 'ready') start();
          else togglePause();
        });
        restartEl.addEventListener('click', reset);

        document.addEventListener('visibilitychange', () => {
          if (document.hidden && state === 'running') togglePause();
        });

        function applyTheme() {
          let t = null;
          try {
            t = window.parent.document.documentElement.dataset.theme;
          } catch {
            /* 忽略 */
          }
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          /* 只在真的变了才写：单独打开时观察的是自己，写回会再触发一次观察回调 */
          const next = t === 'dark' ? 'dark' : 'light';
          if (document.documentElement.dataset.theme !== next) {
            document.documentElement.dataset.theme = next;
          }
          draw();
        }

        applyTheme();
        /* 单独打开时 window.parent 就是自己，观察自己会和上面的写回打成一团 */
        if (window.parent !== window) {
          try {
            new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ['data-theme'],
            });
          } catch {
            /* 跨域时没有可观察的父页面 */
          }
        }
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
        window.addEventListener('resize', resize);
        if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

        reset();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
