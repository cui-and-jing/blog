<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>2048 · 数字合并</title>
    <meta name="description" content="四乘四的格子，相同的数字撞在一起就翻倍。支持键盘、触屏与一步撤销。" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f2f0e9;
        --card: #fffdf8;
        --ink: #1b1916;
        --soft: #55504a;
        --mute: #696359;
        --line: #e2dcd0;
        --accent: #b4431f;
        --slot: #e9e3d7;
        color-scheme: light;
      }

      html[data-theme='dark'] {
        --bg: #131311;
        --card: #1c1c19;
        --ink: #ede9e0;
        --soft: #a9a49a;
        --mute: #989186;
        --line: #2b2a26;
        --accent: #e2825c;
        --slot: #262521;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        overflow: hidden;
      }

      .bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px 6px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        min-width: 62px;
        padding: 5px 12px 6px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
      }

      .stat b {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        font-size: 10.5px;
        letter-spacing: 0.04em;
        color: var(--mute);
      }

      .spacer {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--soft);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .btn:hover:not(:disabled) {
        color: var(--ink);
        border-color: color-mix(in srgb, var(--ink) 24%, transparent);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 4px 12px 14px;
      }

      .board {
        position: relative;
        border-radius: 16px;
        background: var(--slot);
        touch-action: none;
        user-select: none;
        outline: none;
      }

      .board:focus-visible {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent);
      }

      .slot {
        position: absolute;
        border-radius: 10px;
        background: color-mix(in srgb, var(--bg) 55%, transparent);
      }

      .tile {
        position: absolute;
        top: 0;
        left: 0;
        display: grid;
        place-items: center;
        border-radius: 10px;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: transform 0.11s ease-out, background-color 0.15s ease, color 0.15s ease;
        will-change: transform;
      }

      .tile.is-new {
        animation: appear 0.14s ease-out;
      }

      .tile.is-merged {
        animation: bump 0.16s ease-out;
      }

      .tile.is-gone {
        z-index: 1;
        opacity: 0;
        transition: transform 0.11s ease-out, opacity 0.11s ease-out 0.08s;
      }

      .board.no-anim .tile {
        transition: none;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: scale(0.6) translate(0, 0);
        }
      }

      @keyframes bump {
        50% {
          filter: brightness(1.14);
        }
      }

      .hint {
        margin: 0;
        min-height: 18px;
        font-size: 12.5px;
        color: var(--mute);
        text-align: center;
      }

      .over {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 20px;
        text-align: center;
        background: color-mix(in srgb, var(--card) 90%, transparent);
        border-radius: 16px;
        backdrop-filter: blur(3px);
        animation: fade 0.2s ease-out;
      }

      .over[hidden] {
        display: none;
      }

      .over p {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 22px;
        line-height: 1.4;
      }

      .over small {
        color: var(--mute);
        font-size: 12.5px;
      }

      .over-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .primary {
        min-height: 42px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 13.5px;
        cursor: pointer;
      }

      .primary:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tile,
        .tile.is-gone {
          transition-duration: 0.01s;
        }

        .tile.is-new,
        .tile.is-merged,
        .over {
          animation: none;
        }
      }

      /* 独立打开这一页时也要有个 h1，屏幕阅读器才知道这是什么地方 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <header class="bar">
      <div class="stat"><b id="score">0</b><span>分数</span></div>
      <div class="stat"><b id="best">0</b><span>最高</span></div>
      <span class="spacer"></span>
      <button class="btn" id="undo" type="button" disabled>撤销</button>
      <button class="btn" id="restart" type="button">重开</button>
    </header>

    <main class="stage">
      <h1 class="sr-only">2048</h1>
      <div
        class="board"
        id="board"
        tabindex="0"
        role="application"
        aria-label="2048 棋盘。用方向键或 WASD 移动方块，R 重新开始，U 撤销。"
      >
        <div id="slots" aria-hidden="true"></div>
        <div id="tiles"></div>
        <div class="over" id="over" hidden>
          <p id="over-title">没有空格了</p>
          <small id="over-sub">再来一局试试</small>
          <div class="over-actions">
            <button class="primary" id="over-main" type="button">重开一局</button>
            <button class="btn" id="over-alt" type="button" hidden>继续玩</button>
          </div>
        </div>
      </div>
      <p class="hint" id="hint" aria-live="polite">方向键 / WASD 移动，手机可以直接滑动</p>
    </main>

    <script>
      (() => {
        'use strict';

        const SIZE = 4;
        const BEST_KEY = 'cj:2048:best';

        const boardEl = document.getElementById('board');
        const slotsEl = document.getElementById('slots');
        const tilesEl = document.getElementById('tiles');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const undoEl = document.getElementById('undo');
        const restartEl = document.getElementById('restart');
        const hintEl = document.getElementById('hint');
        const overEl = document.getElementById('over');
        const overTitle = document.getElementById('over-title');
        const overSub = document.getElementById('over-sub');
        const overMain = document.getElementById('over-main');
        const overAlt = document.getElementById('over-alt');

        /* 亮暗两套方块配色。深色下同一数值要更沉一点，否则白字压不住 */
        const PALETTE = {
          light: {
            2: ['#f6e7cf', '#7a4a20'],
            4: ['#f0d9b0', '#7a4a20'],
            8: ['#e8b878', '#5e3512'],
            16: ['#d9924a', '#fffaf2'],
            32: ['#c9752f', '#fffaf2'],
            64: ['#b4551f', '#fffaf2'],
            128: ['#a34a1d', '#fffaf2'],
            256: ['#92401a', '#fffaf2'],
            512: ['#7f3716', '#fffaf2'],
            1024: ['#6c2e12', '#fffaf2'],
            2048: ['#b4431f', '#fffaf2'],
          },
          dark: {
            2: ['#3a352c', '#e8dfcd'],
            4: ['#47402f', '#f2e9d6'],
            8: ['#6b4a22', '#ffe9c9'],
            16: ['#8a5620', '#fff3de'],
            32: ['#a3601f', '#fff6e6'],
            64: ['#b96a22', '#fff8ec'],
            128: ['#8a4419', '#fff4e4'],
            256: ['#7b3a16', '#fff4e4'],
            512: ['#6a3113', '#ffefd9'],
            1024: ['#582810', '#ffefd9'],
            2048: ['#e2825c', '#20140e'],
          },
        };

        let grid = [];
        let tiles = []; // { id, v, r, c, el }
        let nextId = 1;
        let score = 0;
        let best = readBest();
        let finished = false;
        let keepPlaying = false;
        let snapshot = null;
        let cell = 80;
        let gap = 10;

        function readBest() {
          try {
            return Number(localStorage.getItem(BEST_KEY)) || 0;
          } catch {
            return 0;
          }
        }

        function writeBest(v) {
          try {
            localStorage.setItem(BEST_KEY, String(v));
          } catch {
            /* 隐私模式下写不进去，忽略即可 */
          }
        }

        function themeName() {
          return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
        }

        function colorOf(v) {
          const table = PALETTE[themeName()];
          return table[v] || (themeName() === 'dark' ? ['#2f6f66', '#eafff8'] : ['#2f6f66', '#f6fffb']);
        }

        /* ---------- 尺寸：跟着可用空间走，永远保持正方形 ---------- */
        function layout() {
          const stage = boardEl.parentElement;
          const availW = stage.clientWidth - 24;
          const availH = stage.clientHeight - 40;
          const size = Math.max(220, Math.min(availW, availH, 460));
          gap = Math.max(7, Math.round(size * 0.024));
          cell = (size - gap * (SIZE + 1)) / SIZE;
          boardEl.style.width = size + 'px';
          boardEl.style.height = size + 'px';
          drawSlots();
          boardEl.classList.add('no-anim');
          for (const t of tiles) place(t, false);
          drawSlots();
          requestAnimationFrame(() => boardEl.classList.remove('no-anim'));
        }

        function slotPos(r, c) {
          return [gap + c * (cell + gap), gap + r * (cell + gap)];
        }

        function drawSlots() {
          slotsEl.innerHTML = '';
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              const el = document.createElement('div');
              el.className = 'slot';
              const [x, y] = slotPos(r, c);
              el.style.cssText = `left:${x}px;top:${y}px;width:${cell}px;height:${cell}px`;
              slotsEl.appendChild(el);
            }
          }
        }

        /* ---------- 渲染 ---------- */
        function makeTile(t) {
          const el = document.createElement('div');
          el.className = 'tile';
          el.textContent = t.v;
          tilesEl.appendChild(el);
          t.el = el;
          paint(t);
          place(t, false);
          return t;
        }

        function paint(t) {
          const [bg, fg] = colorOf(t.v);
          const digits = String(t.v).length;
          t.el.textContent = t.v;
          t.el.style.background = bg;
          t.el.style.color = fg;
          t.el.style.width = cell + 'px';
          t.el.style.height = cell + 'px';
          t.el.style.fontSize = Math.round(cell * (digits <= 2 ? 0.44 : digits === 3 ? 0.35 : 0.28)) + 'px';
        }

        function place(t, animate = true) {
          const [x, y] = slotPos(t.r, t.c);
          if (!animate) t.el.style.transition = 'none';
          t.el.style.transform = `translate3d(${x}px,${y}px,0)`;
          if (!animate) {
            t.el.offsetHeight;
            t.el.style.removeProperty('transition');
          }
        }

        function updateStats() {
          scoreEl.textContent = score;
          if (score > best) {
            best = score;
            writeBest(best);
          }
          bestEl.textContent = best;
        }

        /* ---------- 棋盘状态 ---------- */
        function emptyBoard() {
          return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
        }

        function spawn(v) {
          const free = [];
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) if (!grid[r][c]) free.push([r, c]);
          }
          if (!free.length) return null;
          const [r, c] = free[Math.floor(Math.random() * free.length)];
          const tile = makeTile({ id: nextId++, v: v || (Math.random() < 0.9 ? 2 : 4), r, c });
          tile.el.classList.add('is-new');
          grid[r][c] = tile;
          tiles.push(tile);
          return tile;
        }

        function lines(dir) {
          const out = [];
          for (let i = 0; i < SIZE; i++) {
            const line = [];
            for (let j = 0; j < SIZE; j++) {
              if (dir === 'left') line.push([i, j]);
              else if (dir === 'right') line.push([i, SIZE - 1 - j]);
              else if (dir === 'up') line.push([j, i]);
              else line.push([SIZE - 1 - j, i]);
            }
            out.push(line);
          }
          return out;
        }

        function move(dir) {
          if (finished && !keepPlaying) return;
          const before = tiles.map((t) => ({ v: t.v, r: t.r, c: t.c }));
          const beforeScore = score;

          let moved = false;
          for (const line of lines(dir)) {
            const seq = line.map(([r, c]) => grid[r][c]).filter(Boolean);
            const out = [];
            for (const t of seq) {
              const last = out[out.length - 1];
              if (last && last.v === t.v && !last.mergedThisMove) {
                last.mergedThisMove = true;
                last.eat = t;
              } else {
                out.push(t);
              }
            }
            line.forEach(([r, c], i) => {
              grid[r][c] = out[i] || null;
            });
            out.forEach((t, i) => {
              const [r, c] = line[i];
              if (t.r !== r || t.c !== c) moved = true;
              t.r = r;
              t.c = c;
            });
          }

          if (!moved) {
            for (const t of tiles) {
              t.mergedThisMove = false;
              t.eat = null;
            }
            /* 动不了就是死局：这里也要给提示，否则玩家只会觉得按键没反应 */
            if (!finished && isStuck()) {
              finished = true;
              showOver(false);
            }
            return;
          }

          snapshot = { tiles: before, score: beforeScore };
          undoEl.disabled = false;

          for (const t of [...tiles]) {
            if (t.eat) {
              const eaten = t.eat;
              t.v *= 2;
              score += t.v;
              place(eaten, true);
              eaten.el.classList.add('is-gone');
              const el = eaten.el;
              setTimeout(() => el.remove(), 160);
              tiles = tiles.filter((x) => x !== eaten);
              t.el.classList.add('is-merged');
              setTimeout(() => t.el.classList.remove('is-merged'), 200);
              paint(t);
              moved = true;
            }
            t.mergedThisMove = false;
            t.eat = null;
            place(t, true);
          }

          for (const t of tiles) {
            if (t.v >= 2048 && !keepPlaying && !finished) {
              finished = true;
              showOver(true);
              break;
            }
          }

          spawn();
          updateStats();
          if (!finished && isStuck()) {
            finished = true;
            showOver(false);
          }
        }

        function isStuck() {
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              const t = grid[r][c];
              if (!t) return false;
              const right = c + 1 < SIZE ? grid[r][c + 1] : null;
              const down = r + 1 < SIZE ? grid[r + 1][c] : null;
              if ((right && right.v === t.v) || (down && down.v === t.v)) return false;
            }
          }
          return true;
        }

        function showOver(win) {
          overTitle.textContent = win ? '合出 2048 了' : '没有可动的格子了';
          overSub.textContent = win
            ? `当前 ${score} 分，还能继续往上叠`
            : `这局 ${score} 分，最高 ${Math.max(best, score)} 分`;
          overMain.textContent = win ? '继续玩' : '重开一局';
          overAlt.hidden = !win;
          overAlt.textContent = '重开一局';
          overEl.hidden = false;
          hintEl.textContent = win ? '达成 2048' : '这一局结束了';
          overMain.focus({ preventScroll: true });
        }

        function reset() {
          tilesEl.innerHTML = '';
          grid = emptyBoard();
          tiles = [];
          score = 0;
          finished = false;
          keepPlaying = false;
          snapshot = null;
          undoEl.disabled = true;
          overEl.hidden = true;
          hintEl.textContent = '方向键 / WASD 移动，手机可以直接滑动';
          spawn();
          spawn();
          updateStats();
          layout();
        }

        function undo() {
          if (!snapshot) return;
          tilesEl.innerHTML = '';
          tiles = [];
          grid = emptyBoard();
          for (const item of snapshot.tiles) {
            const t = makeTile({ id: nextId++, v: item.v, r: item.r, c: item.c });
            grid[item.r][item.c] = t;
            tiles.push(t);
          }
          score = snapshot.score;
          snapshot = null;
          undoEl.disabled = true;
          finished = false;
          keepPlaying = false;
          overEl.hidden = true;
          updateStats();
          layout();
          hintEl.textContent = '已退回上一步';
        }

        /* ---------- 输入 ---------- */
        const KEYS = {
          ArrowLeft: 'left',
          ArrowRight: 'right',
          ArrowUp: 'up',
          ArrowDown: 'down',
          a: 'left',
          d: 'right',
          w: 'up',
          s: 'down',
          A: 'left',
          D: 'right',
          W: 'up',
          S: 'down',
          h: 'left',
          l: 'right',
          k: 'up',
          j: 'down',
        };

        window.addEventListener('keydown', (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          const dir = KEYS[e.key];
          if (dir) {
            e.preventDefault();
            move(dir);
            return;
          }
          if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            reset();
          } else if (e.key === 'u' || e.key === 'U' || e.key === 'z' || e.key === 'Z') {
            e.preventDefault();
            undo();
          }
        });

        let start = null;
        boardEl.addEventListener('pointerdown', (e) => {
          start = { x: e.clientX, y: e.clientY };
        });
        boardEl.addEventListener('pointerup', (e) => {
          if (!start) return;
          const dx = e.clientX - start.x;
          const dy = e.clientY - start.y;
          start = null;
          if (Math.hypot(dx, dy) < 22) return;
          if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
          else move(dy > 0 ? 'down' : 'up');
        });
        boardEl.addEventListener('pointercancel', () => {
          start = null;
        });

        restartEl.addEventListener('click', reset);
        undoEl.addEventListener('click', undo);
        overMain.addEventListener('click', () => {
          if (overMain.textContent === '继续玩') {
            keepPlaying = true;
            finished = false;
            overEl.hidden = true;
            boardEl.focus({ preventScroll: true });
          } else {
            reset();
          }
        });
        overAlt.addEventListener('click', reset);

        /* ---------- 跟随站点的主题 ----------
           同源 iframe 里直接读父页面的 data-theme；单独打开时退回系统偏好 */
        function applyTheme() {
          let t = null;
          try {
            t = window.parent.document.documentElement.dataset.theme;
          } catch {
            /* 跨域或被禁用时忽略 */
          }
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          /* 只在真的变了才写：单独打开时观察的是自己，写回会再触发一次观察回调 */
          const next = t === 'dark' ? 'dark' : 'light';
          if (document.documentElement.dataset.theme !== next) {
            document.documentElement.dataset.theme = next;
          }
          for (const tile of tiles) paint(tile);
        }

        applyTheme();
        /* 单独打开时 window.parent 就是自己，观察自己会和上面的写回打成一团 */
        if (window.parent !== window) {
          try {
            new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ['data-theme'],
            });
          } catch {
            /* 跨域时没有可观察的父页面 */
          }
        }
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

        window.addEventListener('resize', layout);
        if (window.ResizeObserver) new ResizeObserver(layout).observe(boardEl.parentElement);

        reset();
      })();
    </script>
  </body>
</html>
