<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MINESWEEPER · 扫雷</title>
    <meta name="description" content="数字是周围八格里地雷的数量，靠推理排干净。三档难度，第一次点开的格子永远安全。" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --bg: #f2f0e9;
        --card: #fffdf8;
        --ink: #1b1916;
        --soft: #55504a;
        --mute: #696359;
        --line: #e2dcd0;
        --accent: #b4431f;
        --cell: #e9e3d7;
        --cell-top: #f4efe4;
        --open: #fbf8f1;
        --flag: #b4431f;
        color-scheme: light;
      }

      html[data-theme='dark'] {
        --bg: #131311;
        --card: #1c1c19;
        --ink: #ede9e0;
        --soft: #a9a49a;
        --mute: #989186;
        --line: #2b2a26;
        --accent: #e2825c;
        --cell: #2a2925;
        --cell-top: #34322d;
        --open: #201f1c;
        --flag: #e2825c;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        overflow: hidden;
      }

      .bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 6px;
      }

      .stat {
        display: flex;
        flex-direction: column;
        min-width: 56px;
        padding: 5px 11px 6px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
      }

      .stat b {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        font-size: 10.5px;
        letter-spacing: 0.04em;
        color: var(--mute);
      }

      .spacer {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 15px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--soft);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .btn:hover {
        color: var(--ink);
      }

      .btn:focus-visible,
      .seg button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .seg {
        flex: none;
        display: flex;
        gap: 2px;
        margin: 0 14px;
        padding: 3px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        align-self: flex-start;
      }

      .seg button {
        flex: 1;
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--soft);
        font-family: inherit;
        font-size: 12.5px;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.16s ease, color 0.16s ease;
      }

      .seg button[aria-pressed='true'] {
        background: var(--bg-soft, #eae6dc);
        color: var(--ink);
        font-weight: 600;
      }

      html[data-theme='dark'] .seg button[aria-pressed='true'] {
        background: #2a2925;
      }

      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 12px 12px;
      }

      .scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        padding: 2px;
      }

      /* 用 margin:auto 而不是 align-items:center：后者在内容比容器高时
         会把顶部裁掉，滚动也够不回来 */
      .grid {
        margin: auto;
        display: grid;
        grid-template-columns: repeat(var(--cols), var(--size));
        gap: 2px;
        padding: 6px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .cell {
        display: grid;
        place-items: center;
        width: var(--size);
        height: var(--size);
        border-radius: 5px;
        background: var(--cell);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: calc(var(--size) * 0.56);
        line-height: 1;
        cursor: pointer;
        user-select: none;
        transition: background 0.12s ease;
      }

      .cell:hover:not(.open) {
        background: var(--cell-top);
      }

      .cell.open {
        background: var(--open);
        cursor: default;
      }

      .cell.flag::after {
        content: '▲';
        font-size: calc(var(--size) * 0.52);
        color: var(--flag);
      }

      .cell.mine {
        background: color-mix(in srgb, var(--accent) 22%, var(--open));
      }

      .cell.flag-wrong {
        background: color-mix(in srgb, var(--accent) 16%, var(--open));
        color: var(--accent);
      }

      .cell:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        z-index: 1;
      }

      /* 数字颜色在亮暗两套底色上都校验过对比度，别随意调浅 */
      .n1 {
        color: #1d5fa8;
      }
      .n2 {
        color: #1f7a45;
      }
      .n3 {
        color: #a83331;
      }
      .n4 {
        color: #5b3fa8;
      }
      .n5 {
        color: #7a3b12;
      }
      .n6 {
        color: #176e70;
      }
      .n7 {
        color: #1b1916;
      }
      .n8 {
        color: #55504a;
      }

      html[data-theme='dark'] .n1 {
        color: #7ab3f0;
      }
      html[data-theme='dark'] .n2 {
        color: #6fc48f;
      }
      html[data-theme='dark'] .n3 {
        color: #f08a80;
      }
      html[data-theme='dark'] .n4 {
        color: #b39ff0;
      }
      html[data-theme='dark'] .n5 {
        color: #e0a35c;
      }
      html[data-theme='dark'] .n6 {
        color: #5fc4c6;
      }
      html[data-theme='dark'] .n7 {
        color: #ede9e0;
      }
      html[data-theme='dark'] .n8 {
        color: #a9a49a;
      }

      .hint {
        margin: 0;
        min-height: 17px;
        font-size: 12.5px;
        color: var(--mute);
        text-align: center;
      }

      .done {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: grid;
        justify-items: center;
        gap: 12px;
        min-width: 210px;
        padding: 20px 24px;
        text-align: center;
        background: color-mix(in srgb, var(--card) 95%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.4);
        z-index: 3;
      }

      .done[hidden] {
        display: none;
      }

      .done p {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 19px;
      }

      .done small {
        color: var(--mute);
        font-size: 12.5px;
      }

      .primary {
        min-height: 42px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 13.5px;
        cursor: pointer;
      }

      html[data-theme='dark'] .primary {
        color: #10100e;
      }

      .primary:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      /* 独立打开这一页时也要有个 h1，屏幕阅读器才知道这是什么地方 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <header class="bar">
      <div class="stat"><b id="mines">10</b><span>剩余雷</span></div>
      <div class="stat"><b id="time">0:00</b><span>时间</span></div>
      <span class="spacer"></span>
      <button class="btn" id="restart" type="button">重开</button>
    </header>

    <section class="seg" aria-label="难度">
      <button type="button" data-level="easy" aria-pressed="true">初级 9×9</button>
      <button type="button" data-level="medium" aria-pressed="false">中级 16×16</button>
      <button type="button" data-level="hard" aria-pressed="false">高级 16×30</button>
    </section>

    <main class="stage">
      <h1 class="sr-only">扫雷</h1>
      <div class="scroll">
        <div class="grid" id="grid" role="grid" aria-label="扫雷棋盘"></div>
      </div>
      <p class="hint" id="hint" aria-live="polite">左键翻开，右键或长按插旗；双击数字可以快速展开</p>
    </main>

    <div class="done" id="done" hidden>
      <p id="done-title">排干净了</p>
      <small id="done-sub">用时 0:00</small>
      <button class="primary" id="done-btn" type="button">再来一局</button>
    </div>

    <script>
      (() => {
        'use strict';

        const LEVELS = {
          easy: { cols: 9, rows: 9, mines: 10, label: '初级' },
          medium: { cols: 16, rows: 16, mines: 40, label: '中级' },
          hard: { cols: 30, rows: 16, mines: 99, label: '高级' },
        };

        const gridEl = document.getElementById('grid');
        const minesEl = document.getElementById('mines');
        const timeEl = document.getElementById('time');
        const hintEl = document.getElementById('hint');
        const restartEl = document.getElementById('restart');
        const doneEl = document.getElementById('done');
        const doneTitle = document.getElementById('done-title');
        const doneSub = document.getElementById('done-sub');
        const doneBtn = document.getElementById('done-btn');
        const levelButtons = [...document.querySelectorAll('.seg button')];

        let level = 'easy';
        let cfg = LEVELS[level];
        let cells = []; // [{ mine, near, state, el }] 一维
        let opened = 0;
        let flags = 0;
        let started = false;
        let over = false;
        let timer = 0;
        let timerId = 0;
        let focusIndex = 0;

        const idx = (r, c) => r * cfg.cols + c;

        function neighbors(i) {
          const r = Math.floor(i / cfg.cols);
          const c = i % cfg.cols;
          const out = [];
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (!dr && !dc) continue;
              const nr = r + dr;
              const nc = c + dc;
              if (nr < 0 || nc < 0 || nr >= cfg.rows || nc >= cfg.cols) continue;
              out.push(idx(nr, nc));
            }
          }
          return out;
        }

        function cellSize() {
          const scroll = gridEl.parentElement;
          const availW = scroll.clientWidth - 40;
          const availH = scroll.clientHeight - 40;
          /* 初级要能一屏放完，中高级允许横向滚动，格子别缩到点不准 */
          const byW = Math.floor(availW / cfg.cols) - 2;
          const byH = Math.floor(availH / cfg.rows) - 2;
          /* 24px 是 WCAG 2.2 对目标尺寸的底线，格子再小就只能靠精准点击了；
             高级盘放不下一屏是正常的，让容器横向滚动而不是把格子继续压小 */
          const max = cfg.cols > 20 ? 30 : cfg.cols > 10 ? 32 : 40;
          const min = 24;
          return Math.max(min, Math.min(max, byW, byH));
        }

        function build() {
          cfg = LEVELS[level];
          cells = [];
          opened = 0;
          flags = 0;
          started = false;
          over = false;
          timer = 0;
          clearInterval(timerId);
          timerId = 0;
          timeEl.textContent = '0:00';
          minesEl.textContent = cfg.mines;
          doneEl.hidden = true;
          hintEl.textContent = '左键翻开，右键或长按插旗；双击数字可以快速展开';

          const size = cellSize();
          gridEl.style.setProperty('--cols', cfg.cols);
          gridEl.style.setProperty('--size', size + 'px');
          gridEl.setAttribute('aria-rowcount', cfg.rows);
          gridEl.setAttribute('aria-colcount', cfg.cols);
          gridEl.setAttribute('aria-label', `扫雷棋盘，${cfg.rows} 行 ${cfg.cols} 列，${cfg.mines} 颗雷`);
          gridEl.innerHTML = '';

          for (let r = 0; r < cfg.rows; r++) {
            const row = document.createElement('div');
            row.setAttribute('role', 'row');
            row.style.display = 'contents';
            gridEl.appendChild(row);
            for (let c = 0; c < cfg.cols; c++) {
              const i = idx(r, c);
              const el = document.createElement('div');
              el.className = 'cell';
              el.setAttribute('role', 'gridcell');
              el.dataset.i = String(i);
              el.tabIndex = i === 0 ? 0 : -1;
              el.setAttribute('aria-label', `第 ${r + 1} 行第 ${c + 1} 列，未翻开`);
              row.appendChild(el);
              cells.push({ mine: false, near: 0, state: 'hidden', el });
            }
          }
          focusIndex = 0;
        }

        /* ---------- 布雷：第一下必安全 ---------- */
        function plant(safeIndex) {
          const banned = new Set([safeIndex, ...neighbors(safeIndex)]);
          const pool = [];
          for (let i = 0; i < cells.length; i++) if (!banned.has(i)) pool.push(i);
          /* 万一棋盘小到安全区之外放不下这么多雷，就退化成只保护点中的那一格：
             宁可周围有雷，也不能漏放，否则「剩余雷数」会从一开始就对不上 */
          if (pool.length < cfg.mines) {
            pool.length = 0;
            for (let i = 0; i < cells.length; i++) if (i !== safeIndex) pool.push(i);
          }
          for (let k = 0; k < cfg.mines && pool.length; k++) {
            const j = Math.floor(Math.random() * pool.length);
            cells[pool[j]].mine = true;
            pool.splice(j, 1);
          }
          for (let i = 0; i < cells.length; i++) {
            if (cells[i].mine) continue;
            cells[i].near = neighbors(i).filter((n) => cells[n].mine).length;
          }
        }

        function startTimer() {
          if (timerId) return;
          timerId = setInterval(() => {
            timer += 1;
            timeEl.textContent = `${Math.floor(timer / 60)}:${String(timer % 60).padStart(2, '0')}`;
          }, 1000);
        }

        function paint(i) {
          const cell = cells[i];
          const r = Math.floor(i / cfg.cols) + 1;
          const c = (i % cfg.cols) + 1;
          cell.el.className = 'cell';
          cell.el.textContent = '';
          if (cell.state === 'flag') {
            cell.el.classList.add('flag');
            cell.el.setAttribute('aria-label', `第 ${r} 行第 ${c} 列，已插旗`);
          } else if (cell.state === 'wrong') {
            cell.el.classList.add('open', 'flag-wrong');
            cell.el.textContent = '✕';
            cell.el.setAttribute('aria-label', `第 ${r} 行第 ${c} 列，插错的旗子，这里没有雷`);
          } else if (cell.state === 'open') {
            cell.el.classList.add('open');
            if (cell.mine) {
              cell.el.classList.add('mine');
              cell.el.textContent = '✳';
              cell.el.setAttribute('aria-label', `第 ${r} 行第 ${c} 列，地雷`);
            } else if (cell.near > 0) {
              cell.el.textContent = String(cell.near);
              cell.el.classList.add('n' + cell.near);
              cell.el.setAttribute('aria-label', `第 ${r} 行第 ${c} 列，周围 ${cell.near} 颗雷`);
            } else {
              cell.el.setAttribute('aria-label', `第 ${r} 行第 ${c} 列，空白`);
            }
          } else {
            cell.el.setAttribute('aria-label', `第 ${r} 行第 ${c} 列，未翻开`);
          }
        }

        function reveal(i) {
          const cell = cells[i];
          if (cell.state !== 'hidden') return;
          cell.state = 'open';
          opened += 1;
          paint(i);
          if (cell.near === 0 && !cell.mine) {
            /* 用显式栈而不是递归：高级棋盘一次能翻两百多格，递归会爆栈 */
            const stack = [...neighbors(i)];
            while (stack.length) {
              const j = stack.pop();
              const n = cells[j];
              if (n.state !== 'hidden' || n.mine) continue;
              n.state = 'open';
              opened += 1;
              paint(j);
              if (n.near === 0) stack.push(...neighbors(j));
            }
          }
        }

        function checkWin() {
          if (opened !== cells.length - cfg.mines) return;
          over = true;
          clearInterval(timerId);
          timerId = 0;
          for (let i = 0; i < cells.length; i++) {
            if (cells[i].mine && cells[i].state !== 'flag') {
              cells[i].state = 'flag';
              flags += 1;
              paint(i);
            }
          }
          minesEl.textContent = '0';
          doneTitle.textContent = '排干净了';
          doneSub.textContent = `用时 ${Math.floor(timer / 60)}:${String(timer % 60).padStart(2, '0')}，${cfg.label}难度`;
          doneEl.hidden = false;
          doneBtn.focus({ preventScroll: true });
          hintEl.textContent = '全部排完了';
        }

        function boom(i) {
          over = true;
          clearInterval(timerId);
          timerId = 0;
          cells[i].state = 'open';
          for (let j = 0; j < cells.length; j++) {
            const cell = cells[j];
            if (cell.mine && cell.state === 'hidden') {
              cell.state = 'open';
              paint(j);
            } else if (!cell.mine && cell.state === 'flag') {
              cell.state = 'wrong';
              paint(j);
            }
          }
          paint(i);
          doneTitle.textContent = '踩到雷了';
          doneSub.textContent = `还剩 ${cells.length - cfg.mines - opened} 格没排`;
          doneEl.hidden = false;
          doneBtn.focus({ preventScroll: true });
          hintEl.textContent = '踩到雷了，按 R 重开';
        }

        function openCell(i) {
          if (over) return;
          const cell = cells[i];
          if (cell.state !== 'hidden') return;
          if (!started) {
            started = true;
            plant(i);
            startTimer();
          }
          if (cell.mine) {
            boom(i);
            return;
          }
          reveal(i);
          checkWin();
        }

        function toggleFlag(i) {
          if (over) return;
          const cell = cells[i];
          if (cell.state === 'open') return;
          if (!started) {
            started = true;
            plant(i);
            startTimer();
          }
          if (cell.state === 'flag') {
            cell.state = 'hidden';
            flags -= 1;
          } else {
            cell.state = 'flag';
            flags += 1;
          }
          paint(i);
          minesEl.textContent = cfg.mines - flags;
        }

        function chord(i) {
          const cell = cells[i];
          if (cell.state !== 'open' || !cell.near) return;
          const around = neighbors(i);
          const flagged = around.filter((j) => cells[j].state === 'flag').length;
          if (flagged !== cell.near) return;
          for (const j of around) {
            if (cells[j].state === 'hidden') {
              if (cells[j].mine) {
                boom(j);
                return;
              }
              reveal(j);
            }
          }
          checkWin();
        }

        function focusCell(i) {
          const prev = cells[focusIndex];
          if (prev) prev.el.tabIndex = -1;
          focusIndex = i;
          const next = cells[i];
          next.el.tabIndex = 0;
          next.el.focus({ preventScroll: false });
        }

        /* ---------- 事件 ---------- */
        gridEl.addEventListener('click', (e) => {
          const el = e.target.closest('.cell');
          if (!el) return;
          const i = Number(el.dataset.i);
          focusIndex = i;
          openCell(i);
        });

        gridEl.addEventListener('contextmenu', (e) => {
          const el = e.target.closest('.cell');
          if (!el) return;
          e.preventDefault();
          toggleFlag(Number(el.dataset.i));
        });

        gridEl.addEventListener('dblclick', (e) => {
          const el = e.target.closest('.cell');
          if (!el) return;
          chord(Number(el.dataset.i));
        });

        /* 触屏长按插旗：450ms 到了先插旗并吃掉随后的 click */
        let pressTimer = 0;
        let pressed = 0;
        let suppress = false;

        gridEl.addEventListener('pointerdown', (e) => {
          const el = e.target.closest('.cell');
          if (!el) return;
          if (e.pointerType === 'mouse') return;
          pressed = Number(el.dataset.i);
          suppress = false;
          clearTimeout(pressTimer);
          pressTimer = setTimeout(() => {
            suppress = true;
            toggleFlag(pressed);
            if (navigator.vibrate) navigator.vibrate(12);
          }, 450);
        });

        const cancelPress = () => {
          clearTimeout(pressTimer);
          pressTimer = 0;
        };
        gridEl.addEventListener('pointerup', cancelPress);
        gridEl.addEventListener('pointercancel', cancelPress);
        gridEl.addEventListener('pointermove', cancelPress);
        gridEl.addEventListener('click', (e) => {
          if (!suppress) return;
          suppress = false;
          e.stopPropagation();
          e.preventDefault();
        }, true);

        gridEl.addEventListener('keydown', (e) => {
          const el = e.target.closest('.cell');
          if (!el) return;
          const i = Number(el.dataset.i);
          const r = Math.floor(i / cfg.cols);
          const c = i % cfg.cols;

          const move = (nr, nc) => {
            const clampedR = Math.max(0, Math.min(cfg.rows - 1, nr));
            const clampedC = Math.max(0, Math.min(cfg.cols - 1, nc));
            e.preventDefault();
            focusCell(idx(clampedR, clampedC));
          };

          if (e.key === 'ArrowUp') move(r - 1, c);
          else if (e.key === 'ArrowDown') move(r + 1, c);
          else if (e.key === 'ArrowLeft') move(r, c - 1);
          else if (e.key === 'ArrowRight') move(r, c + 1);
          else if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            if (cells[i].state === 'open') chord(i);
            else openCell(i);
          } else if (e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            toggleFlag(i);
          }
        });

        window.addEventListener('keydown', (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            build();
            cells[0] && cells[0].el.focus({ preventScroll: true });
          }
        });

        for (const btn of levelButtons) {
          btn.addEventListener('click', () => {
            level = btn.dataset.level;
            for (const b of levelButtons) b.setAttribute('aria-pressed', String(b === btn));
            build();
          });
        }

        restartEl.addEventListener('click', () => {
          build();
          cells[0] && cells[0].el.focus({ preventScroll: true });
        });
        doneBtn.addEventListener('click', build);

        function applyTheme() {
          let t = null;
          try {
            t = window.parent.document.documentElement.dataset.theme;
          } catch {
            /* 忽略 */
          }
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          /* 只在真的变了才写：单独打开时观察的是自己，写回会再触发一次观察回调 */
          const next = t === 'dark' ? 'dark' : 'light';
          if (document.documentElement.dataset.theme !== next) {
            document.documentElement.dataset.theme = next;
          }
        }

        applyTheme();
        /* 单独打开时 window.parent 就是自己，观察自己会和上面的写回打成一团 */
        if (window.parent !== window) {
          try {
            new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {
              attributes: true,
              attributeFilter: ['data-theme'],
            });
          } catch {
            /* 跨域时没有可观察的父页面 */
          }
        }
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

        let resizeId = 0;
        window.addEventListener('resize', () => {
          clearTimeout(resizeId);
          resizeId = setTimeout(() => {
            const size = cellSize();
            gridEl.style.setProperty('--size', size + 'px');
          }, 120);
        });

        build();
      })();
    </script>
  </body>
</html>
